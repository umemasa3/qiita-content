<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1000" height="260" viewBox="-0.5 -0.5 1000 260">
  <defs/>
  <g>
    <!-- タイトル -->
    <text x="500" y="25" fill="#333333" font-family="Helvetica" font-size="18" text-anchor="middle" font-weight="bold">パターン1：GitOps PR承認フロー</text>
    <!-- 自動/人の判断ラベル -->
    <rect x="175" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="205" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <rect x="390" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="420" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <rect x="600" y="50" width="70" height="22" rx="4" fill="#f8cecc" stroke="#b85450"/>
    <text x="635" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">人の判断</text>
    <rect x="820" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="850" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <!-- 利用者アイコン -->
    <circle cx="60" cy="110" r="15" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <line x1="60" y1="125" x2="60" y2="160" stroke="#6c8ebf" stroke-width="1.5"/>
    <line x1="40" y1="140" x2="80" y2="140" stroke="#6c8ebf" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="45" y2="185" stroke="#6c8ebf" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="75" y2="185" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="60" y="205" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">利用者</text>
    <!-- RHDH Software Template -->
    <rect x="130" y="110" width="160" height="60" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
    <text x="210" y="135" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">RHDH</text>
    <text x="210" y="155" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">Software Template</text>
    <!-- Git Repository -->
    <rect x="350" y="110" width="160" height="60" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="430" y="135" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">Git Repository</text>
    <text x="430" y="155" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">(PR作成)</text>
    <!-- 共通基盤チーム -->
    <circle cx="595" cy="110" r="15" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <line x1="595" y1="125" x2="595" y2="160" stroke="#b85450" stroke-width="1.5"/>
    <line x1="575" y1="140" x2="615" y2="140" stroke="#b85450" stroke-width="1.5"/>
    <line x1="595" y1="160" x2="580" y2="185" stroke="#b85450" stroke-width="1.5"/>
    <line x1="595" y1="160" x2="610" y2="185" stroke="#b85450" stroke-width="1.5"/>
    <text x="595" y="205" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle">共通基盤チーム</text>
    <!-- マージ（ひし形） -->
    <polygon points="720,140 760,110 800,140 760,170" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="760" y="145" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">マージ</text>
    <!-- 自動実行 -->
    <rect x="850" y="110" width="140" height="60" rx="10" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
    <text x="920" y="132" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">HCP Terraform</text>
    <text x="920" y="148" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">/ ArgoCD</text>
    <text x="920" y="164" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動実行</text>
    <!-- 矢印 -->
    <line x1="80" y1="140" x2="128" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="292" y1="140" x2="348" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="512" y1="140" x2="575" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="615" y1="140" x2="718" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="802" y1="140" x2="848" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 矢印ラベル -->
    <text x="310" y="130" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">パラメータ入力</text>
    <text x="545" y="130" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">PRレビュー</text>
    <text x="665" y="130" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">Approve</text>
    <text x="825" y="130" fill="#666" font-family="Helvetica" font-size="10" text-anchor="middle">トリガー</text>
    <!-- 矢印マーカー定義 -->
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
      </marker>
    </defs>
  </g>
</svg>
