    <!-- ラベル -->
    <rect x="175" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="205" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <rect x="370" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="400" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <rect x="570" y="50" width="70" height="22" rx="4" fill="#f8cecc" stroke="#b85450"/>
    <text x="605" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">人の判断</text>
    <rect x="715" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="745" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <rect x="880" y="50" width="60" height="22" rx="4" fill="#d5e8d4" stroke="#82b366"/>
    <text x="910" y="65" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">自動</text>
    <!-- 利用者 -->
