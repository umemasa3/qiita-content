    <line x1="292" y1="140" x2="348" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="482" y1="140" x2="550" y2="140" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="590" y1="130" x2="718" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="802" y1="130" x2="858" y2="130" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- ラベル -->
