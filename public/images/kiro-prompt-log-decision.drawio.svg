<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="820" height="620" viewBox="-0.5 -0.5 820 620">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <g>
    <!-- タイトル -->
    <text x="410" y="28" fill="#333333" font-family="Helvetica" font-size="18" text-anchor="middle" font-weight="bold">プロンプトログをS3出力すべきかの判断フロー</text>

    <!-- スタート -->
    <ellipse cx="410" cy="72" rx="150" ry="28" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="410" y="77" fill="#333" font-family="Helvetica" font-size="13" text-anchor="middle">プロンプトログの有効化を検討</text>

    <!-- Q1: 監査/規制要件 -->
    <polygon points="410,130 570,185 410,240 250,185" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="410" y="180" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">監査・規制・インシデント</text>
    <text x="410" y="197" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">対応の要件があるか？</text>

    <!-- Q2: ログを守り活用する体制 -->
    <polygon points="410,290 590,350 410,410 230,350" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="410" y="340" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">ログを保護・保持管理し</text>
    <text x="410" y="357" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">活用する体制があるか？</text>

    <!-- Q3: 開発者への周知 -->
    <polygon points="410,460 590,515 410,570 230,515" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="410" y="505" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">記録することを開発者に</text>
    <text x="410" y="522" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">周知し合意を取ったか？</text>

    <!-- 結論: 出力しない (Q1 No) -->
    <rect x="620" y="160" width="180" height="50" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="710" y="182" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle" font-weight="bold">出力しない</text>
    <text x="710" y="200" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">集計はダッシュボードで代替</text>

    <!-- 結論: 体制を整えてから (Q2 No) -->
    <rect x="620" y="325" width="180" height="50" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
    <text x="710" y="347" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle" font-weight="bold">体制を整えてから</text>
    <text x="710" y="365" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">保護・保持・活用を設計</text>

    <!-- 結論: 周知してから (Q3 No) -->
    <rect x="620" y="490" width="180" height="50" rx="8" fill="#ffe6cc" stroke="#d79b00" stroke-width="1.5"/>
    <text x="710" y="512" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle" font-weight="bold">周知してから</text>
    <text x="710" y="530" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">黙って監視しない</text>

    <!-- 結論: 出力する (Q3 Yes) -->
    <rect x="320" y="588" width="180" height="30" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="410" y="608" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle" font-weight="bold">S3出力を有効化する</text>

    <!-- 矢印 -->
    <line x1="410" y1="100" x2="410" y2="128" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- Q1 -->
    <line x1="570" y1="185" x2="618" y2="185" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="590" y="176" fill="#cc0000" font-family="Helvetica" font-size="12" font-weight="bold">No</text>
    <line x1="410" y1="240" x2="410" y2="288" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="425" y="268" fill="#228B22" font-family="Helvetica" font-size="12" font-weight="bold">Yes</text>
    <!-- Q2 -->
    <line x1="590" y1="350" x2="618" y2="350" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="341" fill="#cc0000" font-family="Helvetica" font-size="12" font-weight="bold">No</text>
    <line x1="410" y1="410" x2="410" y2="458" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="425" y="438" fill="#228B22" font-family="Helvetica" font-size="12" font-weight="bold">Yes</text>
    <!-- Q3 -->
    <line x1="590" y1="515" x2="618" y2="515" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="600" y="506" fill="#cc0000" font-family="Helvetica" font-size="12" font-weight="bold">No</text>
    <line x1="410" y1="570" x2="410" y2="586" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="425" y="582" fill="#228B22" font-family="Helvetica" font-size="12" font-weight="bold">Yes</text>
  </g>
</svg>
