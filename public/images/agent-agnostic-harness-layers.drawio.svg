<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="900" height="560" viewBox="-0.5 -0.5 900 560">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <g font-family="Helvetica">
    <!-- タイトル -->
    <text x="450" y="28" fill="#333333" font-size="18" text-anchor="middle" font-weight="bold">エージェントが違っても品質をそろえるハーネスの3層</text>

    <!-- 上段: 各チームのエージェント -->
    <text x="450" y="58" fill="#666666" font-size="12" text-anchor="middle">チームごとに使うエージェントは違ってよい</text>
    <rect x="60" y="70" width="140" height="44" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="130" y="91" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">チームA</text>
    <text x="130" y="106" fill="#333" font-size="11" text-anchor="middle">Claude Code</text>
    <rect x="220" y="70" width="140" height="44" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="290" y="91" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">チームB</text>
    <text x="290" y="106" fill="#333" font-size="11" text-anchor="middle">Codex</text>
    <rect x="380" y="70" width="140" height="44" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="450" y="91" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">チームC</text>
    <text x="450" y="106" fill="#333" font-size="11" text-anchor="middle">GitHub Copilot</text>
    <rect x="540" y="70" width="140" height="44" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="610" y="91" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">チームD</text>
    <text x="610" y="106" fill="#333" font-size="11" text-anchor="middle">Kiro</text>
    <rect x="700" y="70" width="140" height="44" rx="8" fill="#f5f5f5" stroke="#666666" stroke-width="1.5"/>
    <text x="770" y="91" fill="#333" font-size="12" text-anchor="middle" font-weight="bold">人が書いたコード</text>
    <text x="770" y="106" fill="#333" font-size="11" text-anchor="middle">エージェントなし</text>

    <!-- 層3: 実行の統制 -->
    <rect x="60" y="140" width="620" height="90" rx="10" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
    <text x="80" y="164" fill="#333" font-size="14" font-weight="bold">3. 実行の統制</text>
    <text x="80" y="184" fill="#333" font-size="12">各ツールの管理機能で、モデル・MCP・シェルの権限を制限する</text>
    <rect x="80" y="194" width="130" height="26" rx="5" fill="#ffffff" stroke="#d6b656"/>
    <text x="145" y="211" fill="#333" font-size="11" text-anchor="middle">managed settings</text>
    <rect x="222" y="194" width="130" height="26" rx="5" fill="#ffffff" stroke="#d6b656"/>
    <text x="287" y="211" fill="#333" font-size="11" text-anchor="middle">Agent security</text>
    <rect x="364" y="194" width="130" height="26" rx="5" fill="#ffffff" stroke="#d6b656"/>
    <text x="429" y="211" fill="#333" font-size="11" text-anchor="middle">Copilotポリシー</text>
    <rect x="506" y="194" width="160" height="26" rx="5" fill="#ffffff" stroke="#d6b656"/>
    <text x="586" y="211" fill="#333" font-size="11" text-anchor="middle">Kiro console</text>
    <text x="370" y="246" fill="#8a6d00" font-size="11" text-anchor="middle">ツールごとに別々に設定する。品質より安全性をそろえる層</text>

    <!-- 層2: 指示と知識 -->
    <rect x="60" y="258" width="620" height="110" rx="10" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
    <text x="80" y="282" fill="#333" font-size="14" font-weight="bold">2. 指示と知識</text>
    <text x="80" y="302" fill="#333" font-size="12">中身は1つにして、ツールごとの入口だけを用意する</text>
    <rect x="80" y="314" width="150" height="40" rx="5" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="155" y="331" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">AGENTS.md</text>
    <text x="155" y="346" fill="#333" font-size="10" text-anchor="middle">規約の正本</text>
    <rect x="242" y="314" width="150" height="40" rx="5" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="317" y="331" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">Skills</text>
    <text x="317" y="346" fill="#333" font-size="10" text-anchor="middle">手順</text>
    <rect x="404" y="314" width="120" height="40" rx="5" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="464" y="331" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">MCPサーバー</text>
    <text x="464" y="346" fill="#333" font-size="10" text-anchor="middle">社内の知識</text>
    <rect x="536" y="314" width="130" height="40" rx="5" fill="#ffffff" stroke="#6c8ebf"/>
    <text x="601" y="331" fill="#333" font-size="11" text-anchor="middle" font-weight="bold">AI-DLCなど</text>
    <text x="601" y="346" fill="#333" font-size="10" text-anchor="middle">進め方・生成</text>
    <text x="370" y="384" fill="#3f5f8f" font-size="11" text-anchor="middle">守られる度合いはエージェントとモデル次第</text>

    <!-- 層1: 品質ゲート（全員が通る） -->
    <rect x="60" y="400" width="780" height="100" rx="10" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="80" y="424" fill="#333" font-size="14" font-weight="bold">1. 品質ゲート（すべての変更が通る）</text>
    <text x="80" y="444" fill="#333" font-size="12">エージェントに関係なく、同じ基準で検査する。ばらつきを抑える効果が一番大きい層</text>
    <rect x="80" y="456" width="170" height="30" rx="5" fill="#ffffff" stroke="#82b366"/>
    <text x="165" y="475" fill="#333" font-size="11" text-anchor="middle">lint・型チェック・テスト</text>
    <rect x="262" y="456" width="170" height="30" rx="5" fill="#ffffff" stroke="#82b366"/>
    <text x="347" y="475" fill="#333" font-size="11" text-anchor="middle">SAST・シークレット検出</text>
    <rect x="444" y="456" width="170" height="30" rx="5" fill="#ffffff" stroke="#82b366"/>
    <text x="529" y="475" fill="#333" font-size="11" text-anchor="middle">ブランチ保護・CODEOWNERS</text>
    <rect x="626" y="456" width="198" height="30" rx="5" fill="#ffffff" stroke="#82b366"/>
    <text x="725" y="475" fill="#333" font-size="11" text-anchor="middle">アーキテクチャテスト</text>

    <!-- 矢印: エージェント → 層を通って品質ゲート -->
    <line x1="130" y1="114" x2="130" y2="138" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="290" y1="114" x2="290" y2="138" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="450" y1="114" x2="450" y2="138" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="610" y1="114" x2="610" y2="138" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <!-- 人のコードは品質ゲートへ直行 -->
    <line x1="770" y1="114" x2="770" y2="398" stroke="#333" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

    <!-- 下段: 本番 -->
    <line x1="450" y1="500" x2="450" y2="522" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="450" y="542" fill="#333" font-size="13" text-anchor="middle" font-weight="bold">mainへのマージ</text>
  </g>
</svg>
