<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="900" height="440" viewBox="-0.5 -0.5 900 440">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <g>
    <!-- タイトル -->
    <text x="450" y="26" fill="#333333" font-family="Helvetica" font-size="18" text-anchor="middle" font-weight="bold">部門ごとの分散導入 と 組織レベルのガバナンス</text>

    <!-- 左: アンチパターン -->
    <rect x="20" y="50" width="410" height="370" rx="10" fill="none" stroke="#b85450" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="225" y="76" fill="#b85450" font-family="Helvetica" font-size="14" text-anchor="middle" font-weight="bold">アンチパターン：部門ごとにバラバラ</text>

    <!-- 各部門アカウント（アカウントインスタンス） -->
    <rect x="45" y="100" width="110" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="100" y="128" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門Aアカウント</text>
    <text x="100" y="146" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自プロファイル</text>
    <text x="100" y="162" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自設定</text>

    <rect x="170" y="100" width="110" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="225" y="128" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門Bアカウント</text>
    <text x="225" y="146" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自プロファイル</text>
    <text x="225" y="162" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自設定</text>

    <rect x="295" y="100" width="110" height="80" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
    <text x="350" y="128" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門Cアカウント</text>
    <text x="350" y="146" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自プロファイル</text>
    <text x="350" y="162" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">独自設定</text>

    <text x="225" y="210" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">各アカウントインスタンスで個別設定</text>

    <!-- 問題点 -->
    <rect x="45" y="230" width="360" height="170" rx="8" fill="#ffffff" stroke="#b85450" stroke-width="1"/>
    <text x="60" y="255" fill="#b85450" font-family="Helvetica" font-size="12" font-weight="bold">課題</text>
    <text x="60" y="280" fill="#333" font-family="Helvetica" font-size="11">・組織レベルのガバナンスが効かない</text>
    <text x="60" y="305" fill="#333" font-family="Helvetica" font-size="11">・ポリシーが部門ごとにバラつく</text>
    <text x="60" y="330" fill="#333" font-family="Helvetica" font-size="11">・20アカウント上限にぶつかる</text>
    <text x="60" y="355" fill="#333" font-family="Helvetica" font-size="11">・使えるモデル/MCPが統一されない</text>
    <text x="60" y="380" fill="#333" font-family="Helvetica" font-size="11">・監査・棚卸しが分散して困難</text>

    <!-- 右: 推奨パターン -->
    <rect x="470" y="50" width="410" height="370" rx="10" fill="none" stroke="#82b366" stroke-width="1.5"/>
    <text x="675" y="76" fill="#5a8a3c" font-family="Helvetica" font-size="14" text-anchor="middle" font-weight="bold">推奨：組織デフォルト＋アカウント上書き</text>

    <!-- 組織レベルガバナンス -->
    <rect x="540" y="95" width="270" height="60" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
    <text x="675" y="120" fill="#333" font-family="Helvetica" font-size="12" text-anchor="middle" font-weight="bold">組織インスタンス (管理アカウント)</text>
    <text x="675" y="140" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle">組織デフォルトのガバナンス</text>

    <!-- 各部門（上書き） -->
    <rect x="500" y="220" width="115" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
    <text x="557" y="245" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門A</text>
    <text x="557" y="263" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">組織デフォルト</text>
    <text x="557" y="278" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">を継承</text>

    <rect x="620" y="220" width="115" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
    <text x="677" y="245" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門B</text>
    <text x="677" y="263" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">MCP許可リスト</text>
    <text x="677" y="278" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">で上書き</text>

    <rect x="740" y="220" width="115" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
    <text x="797" y="245" fill="#333" font-family="Helvetica" font-size="11" text-anchor="middle" font-weight="bold">部門C</text>
    <text x="797" y="263" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">組織デフォルト</text>
    <text x="797" y="278" fill="#333" font-family="Helvetica" font-size="10" text-anchor="middle">を継承</text>

    <!-- 矢印: 組織 → 各部門 -->
    <line x1="620" y1="155" x2="565" y2="218" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="675" y1="155" x2="677" y2="218" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="730" y1="155" x2="790" y2="218" stroke="#82b366" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- 効果 -->
    <rect x="500" y="315" width="355" height="90" rx="8" fill="#ffffff" stroke="#82b366" stroke-width="1"/>
    <text x="515" y="340" fill="#5a8a3c" font-family="Helvetica" font-size="12" font-weight="bold">効果</text>
    <text x="515" y="363" fill="#333" font-family="Helvetica" font-size="11">・組織で統一ポリシー、例外だけ部門で上書き</text>
    <text x="515" y="386" fill="#333" font-family="Helvetica" font-size="11">・IAM Identity Center統一でガバナンスが効く</text>
  </g>
</svg>
